<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimBora! — Descobrir</title>
  <link rel="stylesheet" href="css/design-system.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="mobile-frame">
    <div class="screen-scroll">
      <div style="font-size:12px; color:var(--muted);">Araguaína, TO ⌄</div>
      <h1 class="title-main" style="margin-top:4px;">Seu match de hoje.</h1>

      <div style="display:flex; justify-content:space-between; align-items:center; margin:14px 0;">
        <span class="chip-soft selected" id="badge-companhia">💜 Encontro / Date</span>
        <div style="background:var(--white); border:1px solid var(--line); border-radius:999px; padding:3px; display:flex; gap:4px;">
          <button id="btn-lista" class="chip active" style="padding:5px 12px; border:none;">Lista</button>
          <button id="btn-mapa" class="chip" style="padding:5px 12px; border:none;">Mapa</button>
        </div>
      </div>

      <p class="subtitle" id="contador-resultados" style="margin-bottom:14px;">Buscando lugares...</p>

      <div id="lista-locais">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <div id="visao-mapa" class="empty-state" style="display:none; background:var(--soft-tint);">
        <p style="font-size:32px; margin-bottom:8px;">🗺️</p>
        <h3 style="color:var(--ink); font-size:16px;">Mapa Interativo — Araguaína, TO</h3>
        <p class="subtitle" id="mapa-resumo" style="margin-top:6px;">Visualização geográfica dos locais filtrados.</p>
      </div>
    </div>
  </main>

  <script src="js/supabase-config.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderBottomNav('lugares');

    const user = JSON.parse(localStorage.getItem('simbora_user') || '{"id":1}');
    const filtros = JSON.parse(localStorage.getItem('simbora_filtros') || '{"companhia":"Encontro / Date","categoria":"Todos","barulho":"todos","luz":"todos","busca":""}');
    document.getElementById('badge-companhia').textContent = `💜 ${filtros.companhia}`;

    document.getElementById('btn-lista').addEventListener('click', () => {
      document.getElementById('btn-lista').classList.add('active');
      document.getElementById('btn-mapa').classList.remove('active');
      document.getElementById('lista-locais').style.display = 'block';
      document.getElementById('visao-mapa').style.display = 'none';
    });

    document.getElementById('btn-mapa').addEventListener('click', () => {
      document.getElementById('btn-mapa').classList.add('active');
      document.getElementById('btn-lista').classList.remove('active');
      document.getElementById('lista-locais').style.display = 'none';
      document.getElementById('visao-mapa').style.display = 'block';
    });

    let favoritosIds = new Set();

    async function carregarLocais() {
      const { data: favs } = await supabaseClient.from('favoritos').select('local_id').eq('usuario_id', user.id);
      favoritosIds = new Set((favs || []).map(f => f.local_id));

      let query = supabaseClient.from('locais').select('*, dicas_amigo(conteudo)');
      if (filtros.categoria && filtros.categoria !== 'Todos') query = query.eq('categoria', filtros.categoria);
      if (filtros.barulho === 'calmo') query = query.lt('nivel_barulho', 50);
      if (filtros.barulho === 'agitado') query = query.gte('nivel_barulho', 50);
      if (filtros.luz === 'meia-luz') query = query.lt('nivel_iluminacao', 50);
      if (filtros.luz === 'claro') query = query.gte('nivel_iluminacao', 50);
      if (filtros.busca) query = query.ilike('nome', `%${filtros.busca}%`);

      const { data: locais } = await query;
      const container = document.getElementById('lista-locais');

      if (!locais || locais.length === 0) {
        document.getElementById('contador-resultados').textContent = '0 lugares encontrados.';
        container.innerHTML = `
          <div class="empty-state">
            <p style="font-size:28px; margin-bottom:8px;">🔎</p>
            <strong style="color:var(--ink);">Nenhum rolê encontrado</strong>
            <p class="subtitle" style="margin-top:6px;">Tente limpar os filtros na aba Pesquisar para ver mais opções.</p>
          </div>`;
        return;
      }

      document.getElementById('contador-resultados').textContent = `${locais.length} lugares com a sua vibe`;
      document.getElementById('mapa-resumo').textContent = `${locais.length} estabelecimentos encontrados num raio de 3 km.`;

      container.innerHTML = locais.map(local => {
        const dica = local.dicas_amigo?.[0]?.conteudo || 'Ambiente recomendado pela comunidade';
        const matchPct = Math.min(98, Math.round(local.nota_media * 19.5));
        const isFav = favoritosIds.has(local.id);
        return `
          <article class="venue-card" onclick="window.location.href='lugar.html?id=${local.id}'" style="cursor:pointer;">
            <div class="venue-cover" style="background-image: url('${local.imagem_url}');">
              <div class="venue-top">
                <span class="badge-glass">💡 ${local.vibe_principal}</span>
                <button class="fav-btn" onclick="alternarFavorito(event, ${local.id}, this)">${isFav ? '💜' : '🤍'}</button>
              </div>
              <div class="venue-bottom">
                <h3>${local.nome}</h3>
                <p>${local.bairro} · ${local.distancia_km} km · ${local.faixa_preco}</p>
                <span class="match-pill">🔥 ${matchPct}% Recomendado para ${filtros.companhia}</span>
              </div>
            </div>
            <div class="venue-tip-bar">⚠️ ${dica}</div>
          </article>
        `;
      }).join('');
    }

    async function alternarFavorito(e, localId, btn) {
      e.stopPropagation();
      if (favoritosIds.has(localId)) {
        await supabaseClient.from('favoritos').delete().eq('usuario_id', user.id).eq('local_id', localId);
        favoritosIds.delete(localId);
        btn.textContent = '🤍';
        showToast('Removido dos favoritos.');
      } else {
        await supabaseClient.from('favoritos').insert({ usuario_id: user.id, local_id: localId });
        favoritosIds.add(localId);
        btn.textContent = '💜';
        showToast('Salvo nos seus favoritos!');
      }
    }

    carregarLocais();
  </script>
</body>
</html>
