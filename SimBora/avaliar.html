<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimBora! — Avaliar</title>
  <link rel="stylesheet" href="css/design-system.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="mobile-frame">
    <div class="screen-scroll">
      <div class="header-bar">
        <button class="btn-back" onclick="history.back()">←</button>
        <span style="font-size:12px; color:var(--muted); font-weight:600;">Sua vez faz o rolê</span>
        <span style="width:36px;"></span>
      </div>

      <h1 class="title-main" id="titulo-avaliar">Como foi sua experiência?</h1>
      <p class="subtitle" style="margin-top:4px;">Conte o que faz esse lugar ser único.</p>

      <h2 class="section-title">1 · Fui com:</h2>
      <div class="chip-row" id="companhia-avaliar">
        <button class="chip" data-val="Solo">Solo</button>
        <button class="chip active" data-val="Date">Date</button>
        <button class="chip" data-val="Galera">Galera</button>
        <button class="chip" data-val="Família">Família</button>
        <button class="chip" data-val="Trabalho">Trabalho</button>
      </div>

      <h2 class="section-title">2 · Assine embaixo ou escolha a Vibe</h2>
      <p class="subtitle" style="margin-bottom:10px;">Toque nas que combinam com a sua visita.</p>
      <div id="tags-container" style="display:flex; flex-wrap:wrap; gap:8px;"></div>

      <h2 class="section-title">3 · Deixe uma Dica de Amigo</h2>
      <div style="display:flex; gap:8px; margin-bottom:10px;" id="tipo-dica-row">
        <button type="button" class="chip active" data-tipo="positiva">💡 Dica Positiva</button>
        <button type="button" class="chip" data-tipo="alerta">⚠️ Alerta / Atenção</button>
      </div>

      <div style="background:var(--white); border:1px solid var(--line); border-radius:16px; padding:12px;">
        <textarea id="dica-texto" maxlength="140" rows="3" placeholder="Ex.: Chegue antes das 20h para pegar uma mesa..."
                  style="width:100%; border:none; outline:none; resize:none; font-size:13px; color:var(--ink);"></textarea>
        <div style="text-align:right; font-size:11px; color:var(--muted);" id="char-count">0/140</div>
      </div>

      <button class="btn-primary" id="btn-publicar" style="margin-top:20px;">Publicar Avaliação</button>
    </div>
  </main>

  <script src="js/supabase-config.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderBottomNav('lugares');
    const params = new URLSearchParams(window.location.search);
    const localId = Number(params.get('id') || 1);
    const localNome = params.get('nome') || 'Casa Âmbar';
    document.getElementById('titulo-avaliar').textContent = `Como foi sua experiência em ${localNome}?`;

    let companhiaEscolhida = 'Date';
    let tipoDica = 'positiva';
    const tagsSelecionadas = new Set();

    document.querySelectorAll('#companhia-avaliar .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#companhia-avaliar .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        companhiaEscolhida = btn.dataset.val;
      });
    });

    document.querySelectorAll('#tipo-dica-row .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#tipo-dica-row .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tipoDica = btn.dataset.tipo;
      });
    });

    document.getElementById('dica-texto').addEventListener('input', (e) => {
      document.getElementById('char-count').textContent = `${e.target.value.length}/140`;
    });

    async function carregarTags() {
      const { data: votos } = await supabaseClient
        .from('local_tags_votos')
        .select('id, quantidade_votos, tag_id, tags_vibe(rotulo)')
        .eq('local_id', localId);

      const container = document.getElementById('tags-container');
      container.innerHTML = (votos || []).map(v => `
        <button class="chip-soft" data-voto-id="${v.id}" data-count="${v.quantidade_votos}">
          ${v.tags_vibe.rotulo} · ${v.quantidade_votos}
        </button>
      `).join('');

      container.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('selected');
          const id = btn.dataset.votoId;
          if (tagsSelecionadas.has(id)) tagsSelecionadas.delete(id);
          else tagsSelecionadas.add(id);
        });
      });
    }

    document.getElementById('btn-publicar').addEventListener('click', async () => {
      const btn = document.getElementById('btn-publicar');
      btn.textContent = 'Salvando no banco...';
      btn.disabled = true;

      const user = JSON.parse(localStorage.getItem('simbora_user') || '{"id":1}');

      await supabaseClient.from('avaliacoes').insert({
        local_id: localId,
        usuario_id: user.id,
        tipo_companhia: companhiaEscolhida
      });

      for (const votoId of tagsSelecionadas) {
        const el = document.querySelector(`[data-voto-id="${votoId}"]`);
        const novoTotal = Number(el.dataset.count) + 1;
        await supabaseClient.from('local_tags_votos').update({ quantidade_votos: novoTotal }).eq('id', votoId);
      }

      const dica = document.getElementById('dica-texto').value.trim();
      if (dica) {
        await supabaseClient.from('dicas_amigo').insert({
          local_id: localId,
          conteudo: dica,
          tipo_dica: tipoDica
        });
      }

      const { data: localAtual } = await supabaseClient.from('locais').select('total_avaliacoes').eq('id', localId).single();
      if (localAtual) {
        await supabaseClient.from('locais').update({ total_avaliacoes: localAtual.total_avaliacoes + 1 }).eq('id', localId);
      }

      showToast('Avaliação publicada com sucesso!');
      setTimeout(() => { window.location.href = `lugar.html?id=${localId}`; }, 900);
    });

    carregarTags();
  </script>
</body>
</html>
