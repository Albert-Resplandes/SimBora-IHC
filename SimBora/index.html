<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimBora! — Boas-vindas</title>
  <link rel="stylesheet" href="css/design-system.css">
  <!-- Biblioteca oficial do Supabase carregada direto pela internet -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="mobile-frame">
    <header><div class="brand-logo">SimBora!</div></header>

    <section id="slide-content" style="text-align: center;">
      <h1 class="title-main" id="slide-title">Seu próximo passeio começa aqui.</h1>
      <p class="subtitle" id="slide-desc">Entre e descubra lugares que são a sua cara.</p>

      <div id="login-box" style="display: none; margin-top: 24px; text-align: left;">
        <input type="email" id="email" placeholder="Seu e-mail" value="professor@simbora.app"
               style="width:100%; padding:14px; border-radius:16px; border:1px solid var(--line); margin-bottom:12px;">
        <input type="password" id="senha" placeholder="Sua senha" value="123456"
               style="width:100%; padding:14px; border-radius:16px; border:1px solid var(--line);">
        <p id="status-msg" style="font-size: 12px; color: var(--accent); margin-top: 10px; text-align: center;"></p>
      </div>
    </section>

    <footer>
      <div id="dots" style="display:flex; justify-content:center; gap:6px; margin-bottom:20px;">
        <span style="width:16px; height:6px; border-radius:4px; background:var(--accent);"></span>
        <span style="width:6px; height:6px; border-radius:4px; background:var(--line);"></span>
        <span style="width:6px; height:6px; border-radius:4px; background:var(--line);"></span>
        <span style="width:6px; height:6px; border-radius:4px; background:var(--line);"></span>
      </div>
      <button class="btn-primary" id="btn-next">Prosseguir →</button>
    </footer>
  </main>

  <script src="js/supabase-config.js"></script>
  <script>
    const slides = [
      { title: "Seu próximo passeio começa aqui.", desc: "Entre e descubra lugares que são a sua cara." },
      { title: "Encontre o local perfeito pro seu rolê!", desc: "Para todos os tipos e tamanhos de lugares e grupos." },
      { title: "Esteja por dentro dos segredos da casa.", desc: "Dicas e avisos para se preparar antes de escolher." },
      { title: "Mostre a todos o que você achou do lugar.", desc: "Avalie e deixe suas experiências e dicas do local." },
      { title: "Pronto para escolher? Vamos!", desc: "Crie ou entre na sua conta para iniciarmos.", login: true }
    ];
    let step = 0;

    document.getElementById('btn-next').addEventListener('click', async () => {
      if (step < slides.length - 1) {
        step++;
        document.getElementById('slide-title').textContent = slides[step].title;
        document.getElementById('slide-desc').textContent = slides[step].desc;
        if (slides[step].login) {
          document.getElementById('login-box').style.display = 'block';
          document.getElementById('btn-next').textContent = 'Entrar no SimBora!';
        }
      } else {
        // Testa a conexão real com a tabela 'usuarios' no Supabase
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const status = document.getElementById('status-msg');
        status.textContent = "Conectando ao banco de dados...";

        const { data, error } = await supabaseClient
          .from('usuarios')
          .select('*')
          .eq('email', email)
          .eq('senha', senha)
          .single();

        if (data) {
          status.style.color = "#28775E";
          status.textContent = "Conectado com sucesso! Bem-vindo(a), " + data.nome + "!";
        } else {
          status.style.color = "#DC2626";
          status.textContent = "Erro: verifique a URL/chave no arquivo supabase-config.js.";
        }
      }
    });
  </script>
</body>
</html>
